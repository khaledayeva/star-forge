<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative Star Forge run</title>
  <desc id="desc">A dark interface showing a user request, lifecycle progress, Blueprint and Plan state, and live proof checks.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0F17"/>
      <stop offset="1" stop-color="#151A24"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.34"/>
    </filter>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .muted { fill: #8B949E; }
      .body { fill: #D7DEE7; }
      .strong { fill: #F4F7FA; font-weight: 650; }
      .gold { fill: #F59E0B; }
    </style>
  </defs>
  <rect width="1440" height="820" rx="28" fill="url(#bg)"/>
  <circle cx="70" cy="62" r="8" fill="#FF5F57"/>
  <circle cx="96" cy="62" r="8" fill="#FEBC2E"/>
  <circle cx="122" cy="62" r="8" fill="#28C840"/>
  <text x="166" y="70" class="sans strong" font-size="24">A Forge run in motion</text>
  <text x="1288" y="68" class="mono muted" font-size="16">BUILD PHASE</text>

  <g transform="translate(44 102)">
    <rect x="0" y="0" width="1352" height="64" rx="16" fill="#101722" stroke="#2B3442"/>
    <g class="sans" font-size="15" font-weight="650">
      <rect x="18" y="14" width="120" height="36" rx="18" fill="#153A2B"/><text x="48" y="38" fill="#67E8A5">✓ Intake</text>
      <rect x="150" y="14" width="128" height="36" rx="18" fill="#153A2B"/><text x="178" y="38" fill="#67E8A5">✓ Design</text>
      <rect x="290" y="14" width="162" height="36" rx="18" fill="#153A2B"/><text x="318" y="38" fill="#67E8A5">✓ Plan locked</text>
      <rect x="464" y="14" width="126" height="36" rx="18" fill="#3A2A0A" stroke="#F59E0B"/><text x="495" y="38" fill="#FBBF24">● Build</text>
      <rect x="602" y="14" width="116" height="36" rx="18" fill="#1A2230"/><text x="634" y="38" fill="#8B949E">Review</text>
      <rect x="730" y="14" width="118" height="36" rx="18" fill="#1A2230"/><text x="761" y="38" fill="#8B949E">Deliver</text>
      <rect x="860" y="14" width="104" height="36" rx="18" fill="#1A2230"/><text x="894" y="38" fill="#8B949E">Done</text>
    </g>
    <text x="1083" y="38" class="mono muted" font-size="14">source 8f2c1a7</text>
  </g>

  <g transform="translate(44 190)" filter="url(#shadow)">
    <rect width="420" height="568" rx="20" fill="#0F1520" stroke="#2B3442"/>
    <text x="28" y="42" class="sans strong" font-size="20">Codex task</text>
    <text x="28" y="69" class="sans muted" font-size="14">One prompt, continuous coordination</text>
    <line x1="28" y1="91" x2="392" y2="91" stroke="#273140"/>

    <rect x="28" y="118" width="364" height="94" rx="16" fill="#1A2230"/>
    <text x="48" y="146" class="sans gold" font-size="13" font-weight="700">YOU</text>
    <text x="48" y="174" class="sans body" font-size="16">$forge Build a polished finance app</text>
    <text x="48" y="198" class="sans body" font-size="16">for roommates to settle expenses.</text>

    <rect x="28" y="230" width="364" height="156" rx="16" fill="#151C28" stroke="#303A49"/>
    <text x="48" y="260" class="sans gold" font-size="13" font-weight="700">STAR FORGE</text>
    <text x="48" y="291" class="sans strong" font-size="16">Three decisions will change the build:</text>
    <text x="48" y="321" class="sans body" font-size="15">1. iPhone only or shared web access?</text>
    <text x="48" y="347" class="sans body" font-size="15">2. Invite model and settlement rules?</text>
    <text x="48" y="373" class="sans body" font-size="15">3. Preview or TestFlight delivery?</text>

    <rect x="28" y="404" width="364" height="126" rx="16" fill="#10231B" stroke="#245C43"/>
    <text x="48" y="435" class="sans" fill="#67E8A5" font-size="13" font-weight="700">BLUEPRINT APPROVED</text>
    <text x="48" y="465" class="sans body" font-size="15">Design: calm, ledger-first</text>
    <text x="48" y="491" class="sans body" font-size="15">Repository: new private GitHub repo</text>
    <text x="48" y="517" class="sans body" font-size="15">Delivery: simulator-tested source</text>
  </g>

  <g transform="translate(486 190)" filter="url(#shadow)">
    <rect width="430" height="568" rx="20" fill="#0F1520" stroke="#2B3442"/>
    <text x="28" y="42" class="sans strong" font-size="20">Blueprint + Plan</text>
    <text x="28" y="69" class="sans muted" font-size="14">Locked decisions become traced work</text>
    <line x1="28" y1="91" x2="402" y2="91" stroke="#273140"/>

    <text x="28" y="128" class="sans muted" font-size="13" font-weight="700">CURRENT TASK</text>
    <text x="28" y="158" class="mono strong" font-size="18">SF-204 Expense capture flow</text>
    <rect x="28" y="180" width="374" height="10" rx="5" fill="#232C3A"/>
    <rect x="28" y="180" width="245" height="10" rx="5" fill="#F59E0B"/>
    <text x="28" y="219" class="sans body" font-size="15">4 of 7 tasks verified</text>
    <text x="334" y="219" class="mono gold" font-size="14">57%</text>

    <g transform="translate(28 250)" class="sans" font-size="15">
      <rect width="374" height="48" rx="12" fill="#10231B"/><text x="18" y="30" fill="#67E8A5">✓ SF-201 Foundation and CI</text>
      <rect y="60" width="374" height="48" rx="12" fill="#10231B"/><text x="18" y="90" fill="#67E8A5">✓ SF-202 Design system</text>
      <rect y="120" width="374" height="48" rx="12" fill="#3A2A0A" stroke="#8A620B"/><text x="18" y="150" fill="#FBBF24">● SF-204 Expense capture</text>
      <rect y="180" width="374" height="48" rx="12" fill="#151C28"/><text x="18" y="210" fill="#8B949E">○ SF-205 Settlement logic</text>
    </g>

    <rect x="28" y="500" width="374" height="42" rx="12" fill="#151C28"/>
    <text x="46" y="526" class="mono muted" font-size="13">ACs: AC-07, AC-08  ·  Proof: native-ios</text>
  </g>

  <g transform="translate(938 190)" filter="url(#shadow)">
    <rect width="458" height="568" rx="20" fill="#0F1520" stroke="#2B3442"/>
    <text x="28" y="42" class="sans strong" font-size="20">Live proof</text>
    <text x="28" y="69" class="sans muted" font-size="14">Evidence bound to the current source</text>
    <line x1="28" y1="91" x2="430" y2="91" stroke="#273140"/>

    <g transform="translate(28 118)" class="sans">
      <rect width="402" height="72" rx="14" fill="#10231B" stroke="#245C43"/>
      <circle cx="30" cy="36" r="13" fill="#1D6B48"/><text x="24" y="42" fill="#D1FAE5" font-size="17">✓</text>
      <text x="56" y="31" class="strong" font-size="16">Unit + integration tests</text>
      <text x="56" y="53" fill="#67E8A5" font-size="14">42 passed · source 8f2c1a7</text>

      <rect y="88" width="402" height="72" rx="14" fill="#10231B" stroke="#245C43"/>
      <circle cx="30" cy="124" r="13" fill="#1D6B48"/><text x="24" y="130" fill="#D1FAE5" font-size="17">✓</text>
      <text x="56" y="119" class="strong" font-size="16">Simulator launch + UI proof</text>
      <text x="56" y="141" fill="#67E8A5" font-size="14">iPhone 16 · screenshot captured</text>

      <rect y="176" width="402" height="72" rx="14" fill="#3A2A0A" stroke="#8A620B"/>
      <circle cx="30" cy="212" r="13" fill="#6B4A0C"/><text x="25" y="218" fill="#FDE68A" font-size="17">●</text>
      <text x="56" y="207" class="strong" font-size="16">Accessibility review</text>
      <text x="56" y="229" fill="#FBBF24" font-size="14">Queued from Blueprint risk flags</text>

      <rect y="264" width="402" height="72" rx="14" fill="#151C28" stroke="#303A49"/>
      <circle cx="30" cy="300" r="13" fill="#252E3C"/><text x="25" y="306" fill="#8B949E" font-size="17">○</text>
      <text x="56" y="295" class="strong" font-size="16">Delivery proof</text>
      <text x="56" y="317" class="muted" font-size="14">Waits for every affected gate</text>
    </g>

    <rect x="28" y="486" width="402" height="56" rx="14" fill="#111925" stroke="#2B3442"/>
    <text x="48" y="510" class="sans muted" font-size="12" font-weight="700">REQUIRED NEXT ACTION</text>
    <text x="48" y="531" class="mono body" font-size="13">verify SF-204, then continue</text>
  </g>
</svg>
